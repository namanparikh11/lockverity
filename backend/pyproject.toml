# =====================================================================
# Lockverity backend - Python project configuration
# =====================================================================
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lockverity"
version = "0.2.0"
description = "Evidence-first software supply-chain assurance."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Lockverity Contributors" },
]
keywords = ["security", "supply-chain", "sbom", "dependencies", "vulnerabilities"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.27",
    "alembic>=1.13.1",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "greenlet>=3.0.3",
    # Safe YAML loader for GitHub Actions workflow analysis. The SafeLoader
    # in PyYAML already rejects code execution, but we also enforce alias and
    # depth limits in ``app.utils.yaml_safe`` to defend against billion-laughs
    # and stack-overflow attacks via hostile workflow files.
    "pyyaml>=6.0.1",
    # v0.6 CycloneDX 1.7 SBOM export. ``cyclonedx-python-lib`` is the
    # official data-model, 1.7 JSON serializer, and offline schema
    # validator. The ``[json-validation]`` extra is the official
    # dependency channel for the offline JSON validator path the v0.6
    # exporter uses; pulling the extra (rather than re-declaring
    # ``jsonschema`` directly) keeps the version constraint under
    # the library's own maintenance. ``packageurl-python`` is a
    # direct dependency because the exporter itself imports
    # ``PackageURL`` to build and round-trip PURLs from the persisted
    # evidence (it is not just a transitive consumer). None of these
    # libraries make network requests at export time. Pinned with
    # exact versions so the v0.6 dependency tree is fully
    # reproducible from the lockfile alone.
    "cyclonedx-python-lib[json-validation]==11.11.0",
    "packageurl-python==0.15.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    # v2.0.3: pin ruff to the exact patch that produced the
    # committed format. ``scripts/verify_release.py`` runs
    # ``python -m ruff format --check`` over ``app tests scripts``.
    # A fresh ``pip install -e ".[dev]"`` on a clean checkout
    # without this pin resolves the latest release, which has
    # produced a destructive change in the formatter
    # (ruff 0.15.22 deletes module-level docstrings the older
    # format preserved). Pinning keeps the one-command
    # verification reproducible across clean checkouts.
    "ruff==0.15.21",
    "mypy>=1.8.0",
    "types-requests",
    # The current FastAPI/Starlette test client uses ``httpx2`` for its
    # request/response transport.
    "httpx2>=0.0.1",
]

[project.urls]
Homepage = "https://github.com/lockverity/lockverity"
Documentation = "https://github.com/lockverity/lockverity/tree/main/docs"
Issues = "https://github.com/lockverity/lockverity/issues"
Source = "https://github.com/lockverity/lockverity"

[tool.setuptools]
package-dir = { "app" = "app" }

[tool.setuptools.packages.find]
where = ["app"]
include = ["app*"]

# ---------------------------------------------------------------------
# Ruff - linting and formatting
# ---------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "S",    # flake8-bandit (security)
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # FastAPI uses function calls in defaults
    "S101",  # asserts are acceptable in tests and defensive code
    "UP042", # ``class Foo(str, Enum)`` is the SQLAlchemy 2 idiom; StrEnum migration is a future concern
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "N802"]
"alembic/**" = ["E", "F", "N", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:passlib.*",
    "ignore::DeprecationWarning:pkg_resources.*",
]
markers = [
    "integration: marks tests that require a real database or external service",
]

# ---------------------------------------------------------------------
# MyPy - non-blocking for v0.1, configured but not enforced in CI
# ---------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
