<?xml version="1.0" encoding="UTF-8"?>
<!--
  Lockverity application icon (rounded square).

  The L+V mark inside a rounded-rectangle background, sized
  for application-icon use (192x192 in CSS pixels, 1024x1024
  in PNG). The corner radius is 18% of the side length, which
  matches the iOS / Android application-icon convention.

  The background uses a deep ink colour (#0f172a) and the mark
  uses a light foreground (#f8fafc) so the icon is recognisable
  in both light and dark operating-system surfaces.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 100 100"
     role="img"
     aria-label="Lockverity">
  <rect x="0" y="0" width="100" height="100" rx="18" ry="18" fill="#0f172a" />
  <g fill="none"
     stroke="#f8fafc"
     stroke-width="12"
     stroke-linecap="round"
     stroke-linejoin="round">
    <path d="M 22 26 L 22 74 L 50 74" />
    <path d="M 38 26 L 50 74 L 78 26" />
  </g>
</svg>
