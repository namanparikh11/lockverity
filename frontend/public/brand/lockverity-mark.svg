<?xml version="1.0" encoding="UTF-8"?>
<!--
  Lockverity primary mark (full-color).

  Manually defined vector geometry. Interlocking L and V
  suggesting an evidence/chain link. The L's horizontal foot
  meets the V's apex at the bottom-centre; the V's right arm
  extends up to the top-right, forming a single continuous
  shape that reads as both letters.

  Designed in a 100x100 viewBox. Legible from 16px to 256px.
  The stroke uses currentColor so the mark inherits the
  surrounding foreground colour.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 100 100"
     role="img"
     aria-label="Lockverity mark"
     fill="none"
     stroke="currentColor"
     stroke-width="12"
     stroke-linecap="round"
     stroke-linejoin="round">
  <!-- L: vertical bar on the left, then horizontal foot to the centre. -->
  <path d="M 22 16 L 22 78 L 56 78" />
  <!-- V: left arm from the top, meeting the L's foot; right arm to the top-right. -->
  <path d="M 40 16 L 56 78 L 78 16" />
</svg>
