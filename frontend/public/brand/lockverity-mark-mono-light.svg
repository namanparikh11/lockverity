<?xml version="1.0" encoding="UTF-8"?>
<!--
  Lockverity monochrome mark, intended for use on a dark
  background (light stroke on dark surface). Same geometry as
  the primary mark; the foreground colour is fixed to a
  high-contrast light value so the mark renders consistently
  on any dark surface.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 100 100"
     role="img"
     aria-label="Lockverity mark"
     fill="none"
     stroke="#f8fafc"
     stroke-width="12"
     stroke-linecap="round"
     stroke-linejoin="round">
  <path d="M 22 16 L 22 78 L 56 78" />
  <path d="M 40 16 L 56 78 L 78 16" />
</svg>
