<?xml version="1.0" encoding="UTF-8"?>
<!--
  Lockverity Apple touch icon.

  Apple touch icons are delivered as PNG (typically 180x180),
  but we also publish the SVG source so the same shape can be
  re-rendered at any size. The downstream packaging step
  rasterises this SVG to the required PNG resolutions.

  The icon uses the rounded-square application-icon shape
  with the full L+V mark, sized for iOS app-icon conventions.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 100 100"
     role="img"
     aria-label="Lockverity">
  <rect x="0" y="0" width="100" height="100" rx="18" ry="18" fill="#0f172a" />
  <g fill="none"
     stroke="#f8fafc"
     stroke-width="12"
     stroke-linecap="round"
     stroke-linejoin="round">
    <path d="M 22 26 L 22 74 L 50 74" />
    <path d="M 38 26 L 50 74 L 78 26" />
  </g>
</svg>
