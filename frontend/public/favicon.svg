<?xml version="1.0" encoding="UTF-8"?>
<!--
  Lockverity favicon (Rounded App Icon variant).

  This is the canonical tiny-size favicon derived from the
  v2.1 Part A brand design board. The board shows four
  favicon / app icon variants in section "02 FAVICON / APP
  ICON EXPLORATION":

    1. Square App Icon
    2. Rounded App Icon       <-- this file
    3. Monochrome
    4. 16px / 32px

  The Rounded App Icon is a very rounded squircle (high
  corner radius) with the interlocking L/V mark centered
  inside. The mark itself is the same gradient symbol shown
  in section "01 PRIMARY MARK" and is rendered at the
  favicon's tiny size with the same blue-to-teal vertical
  gradient.

  Palette (from section "03 PALETTE"):

    Indigo 900  #0B1324   background
    Teal 500    #2E8BF0   gradient start (top)
    Blue 600    #14B8A6   gradient end (bottom)

  The full-size brand mark in
  ``frontend/public/brand/lockverity-mark.svg`` and the
  full-size application icon in
  ``frontend/public/brand/lockverity-app-icon.svg`` keep
  the interlocking LV concept for the larger surfaces. The
  favicon here is a structural simplification: at 16x16 the
  full-size mark is replaced by two interlocking S-curves
  that trace the same visual rhythm but remain crisp at
  tiny sizes.

  Geometry (16x16 viewBox, integer-aligned):

    Background: rounded square, rx = 3.5 (~22% of side).
    Padding:    4 units on every side; the mark spans the
                inner 8x8 unit area.
    Mark:       two cubic Bezier curves forming an
                interlocking chain-link pattern:
                  Curve 1: M 4 4 C 4 8, 12 8, 12 12
                  Curve 2: M 12 4 C 12 8, 4 8, 4 12
                Both curves are 2 units thick with round
                caps. The gradient is vertical, from the
                Teal 500 blue at the top of the mark to
                the Blue 600 teal at the bottom.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 16 16"
     width="16"
     height="16"
     role="img"
     aria-label="Lockverity">
  <defs>
    <linearGradient id="markGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E8BF0" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="16" height="16" rx="3.5" ry="3.5" fill="#0B1324" />
  <g fill="none" stroke="url(#markGradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 4 4 C 4 8, 12 8, 12 12" />
    <path d="M 12 4 C 12 8, 4 8, 4 12" />
  </g>
</svg>
