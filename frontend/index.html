<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Lockverity - Evidence-first software supply-chain assurance." />
    <title>Lockverity</title>
    <!--
      Favicon and application icons.

      The favicon is the approved "Rounded App Icon" from the
      brand design board, supplied as a 1024x1024 PNG
      (``frontend/public/favicon-source.png``). Every
      compatibility asset in ``frontend/public/`` is derived
      from the source by
      ``backend/scripts/generate_favicon_assets.py`` using
      Pillow's Lanczos resampling; the source is never
      re-derived from any other asset and the geometry is
      never redrawn, traced, or reinterpreted.

      The ``?v=3`` query string on every icon URL is a
      cache-busting hint: Chrome aggressively caches favicons
      across deploys and a stale favicon would otherwise stick
      to a user's tab strip after a deploy. The version is
      bumped whenever the source PNG changes.
    -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=3" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=3" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png?v=3" />
    <link rel="icon" type="image/png" sizes="180x180" href="/favicon-180x180.png?v=3" />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon-256x256.png?v=3" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />
  </head>
  <body class="bg-ink-50 text-ink-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
