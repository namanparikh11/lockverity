<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Lockverity - Evidence-first software supply-chain assurance." />
    <title>Lockverity</title>
    <!--
      Favicon and application icons.

      The SVG favicon is the canonical tiny-size LV monogram
      (see ``frontend/public/favicon.svg`` and
      ``docs/brand-assets.md``). The ICO, 16x16, 32x32, and
      48x48 PNGs are rasterisations of the same geometry and
      are generated by
      ``backend/scripts/generate_favicon_assets.py``.

      The ``?v=2`` query string on every icon URL is a
      cache-busting hint: Chrome aggressively caches favicons
      across deploys and a stale favicon would otherwise stick
      to a user's tab strip after a deploy. The version is
      bumped whenever the favicon geometry changes.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
  </head>
  <body class="bg-ink-50 text-ink-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
