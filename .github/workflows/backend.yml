name: backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: backend

jobs:
  test:
    name: Lint, test, migration cycle
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pytest
        env:
          LOCKVERITY_ENV: test
          LOCKVERITY_DATABASE_URL: sqlite:///./lockverity.sqlite
        run: pytest -q

      - name: Alembic upgrade from empty
        env:
          LOCKVERITY_DATABASE_URL: sqlite:///./lockverity.sqlite
        run: |
          rm -f lockverity.sqlite
          alembic upgrade head

      - name: Alembic downgrade to base
        env:
          LOCKVERITY_DATABASE_URL: sqlite:///./lockverity.sqlite
        run: alembic downgrade base

      - name: Alembic re-upgrade
        env:
          LOCKVERITY_DATABASE_URL: sqlite:///./lockverity.sqlite
        run: |
          alembic upgrade head
